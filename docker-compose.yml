services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: onehouse-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - onehouse

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: onehouse-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: onehouse
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "8084:8080"
    networks:
      - onehouse

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: onehouse-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-password}
      MINIO_DOMAIN: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      onehouse:
        aliases:
          - warehouse.minio

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: onehouse-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-password}
      MINIO_WAREHOUSE_BUCKET: ${MINIO_WAREHOUSE_BUCKET:-warehouse}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/$${MINIO_WAREHOUSE_BUCKET};
      mc anonymous set none local/$${MINIO_WAREHOUSE_BUCKET};
      exit 0;
      "
    networks:
      - onehouse

  iceberg-rest:
    image: tabulario/iceberg-rest:1.6.0
    container_name: onehouse-iceberg-rest
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-admin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-password}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      CATALOG_WAREHOUSE: s3://${MINIO_WAREHOUSE_BUCKET:-warehouse}/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      CATALOG_URI: jdbc:sqlite:file:/tmp/iceberg_rest
    ports:
      - "8181:8181"
    networks:
      - onehouse

  trino:
    image: trinodb/trino:481
    container_name: onehouse-trino
    depends_on:
      iceberg-rest:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    volumes:
      - ./configs/trino/etc:/etc/trino:ro
    networks:
      - onehouse

  simulator:
    build:
      context: ./simulator
    container_name: onehouse-simulator
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      ONEHOUSE_KAFKA_TOPIC: ${ONEHOUSE_KAFKA_TOPIC:-telecom.raw_logs}
      SIMULATOR_EVENTS_PER_SECOND: ${SIMULATOR_EVENTS_PER_SECOND:-20}
      SIMULATOR_DUPLICATE_RATIO: ${SIMULATOR_DUPLICATE_RATIO:-0.01}
      SIMULATOR_BAD_RECORD_RATIO: ${SIMULATOR_BAD_RECORD_RATIO:-0.005}
    networks:
      - onehouse
    restart: unless-stopped

  spark-master:
    build:
      context: ./docker/spark
    container_name: onehouse-spark-master
    environment:
      SPARK_MODE: master
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-admin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-password}
      AWS_REGION: ${AWS_REGION:-us-east-1}
    ports:
      - "7077:7077"
      - "8085:8080"
    networks:
      - onehouse

  spark-worker:
    build:
      context: ./docker/spark
    container_name: onehouse-spark-worker
    depends_on:
      spark-master:
        condition: service_started
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES:-2}
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY:-2g}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-admin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-password}
      AWS_REGION: ${AWS_REGION:-us-east-1}
    ports:
      - "8086:8081"
    networks:
      - onehouse

  spark-streaming:
    build:
      context: ./docker/spark
    container_name: onehouse-spark-streaming
    depends_on:
      spark-master:
        condition: service_started
      spark-worker:
        condition: service_started
      kafka:
        condition: service_healthy
      iceberg-rest:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    environment:
      SPARK_MODE: submit
      SPARK_MASTER_URL: spark://spark-master:7077
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-admin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-password}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      ONEHOUSE_KAFKA_TOPIC: ${ONEHOUSE_KAFKA_TOPIC:-telecom.raw_logs}
      ICEBERG_CATALOG: ${ICEBERG_CATALOG:-viettel}
      ICEBERG_WAREHOUSE: s3://${MINIO_WAREHOUSE_BUCKET:-warehouse}/
      ICEBERG_REST_URI: http://iceberg-rest:8181
      S3_ENDPOINT: http://minio:9000
      SPARK_CHECKPOINT_LOCATION: s3a://${MINIO_WAREHOUSE_BUCKET:-warehouse}/checkpoints/bronze_telecom_events
    volumes:
      - ./spark/jobs:/opt/onehouse/spark/jobs:ro
    ports:
      - "4040:4040"
    networks:
      - onehouse
    restart: on-failure

  # ── CDC Infrastructure ──
  postgres-billing:
    image: postgres:16-alpine
    container_name: onehouse-postgres-billing
    command: >
      postgres
        -c wal_level=logical
        -c max_replication_slots=4
        -c max_wal_senders=4
    environment:
      POSTGRES_USER: ${POSTGRES_BILLING_USER:-viettel}
      POSTGRES_PASSWORD: ${POSTGRES_BILLING_PASSWORD:-viettel}
      POSTGRES_DB: ${POSTGRES_BILLING_DB:-viettel_billing}
    ports:
      - "5432:5432"
    volumes:
      - ./postgresql/init_billing.sql:/docker-entrypoint-initdb.d/01_init.sql
      - ./postgresql/create_publication.sql:/docker-entrypoint-initdb.d/02_publication.sql
      - postgres_billing_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_BILLING_USER:-viettel}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - onehouse

  billing-generator:
    build:
      context: ./simulator
    container_name: onehouse-billing-generator
    depends_on:
      postgres-billing:
        condition: service_healthy
    environment:
      GENERATOR_SCRIPT: billing_generator.py
      POSTGRES_HOST: postgres-billing
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_BILLING_USER:-viettel}
      POSTGRES_PASSWORD: ${POSTGRES_BILLING_PASSWORD:-viettel}
      POSTGRES_DB: ${POSTGRES_BILLING_DB:-viettel_billing}
      BATCH_SIZE: "10"
      INTERVAL_SEC: "5"
    networks:
      - onehouse
    restart: unless-stopped

  debezium:
    image: quay.io/debezium/connect:2.7
    container_name: onehouse-debezium
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: debezium-group
      CONFIG_STORAGE_TOPIC: debezium_configs
      OFFSET_STORAGE_TOPIC: debezium_offsets
      STATUS_STORAGE_TOPIC: debezium_status
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
    depends_on:
      kafka:
        condition: service_healthy
      postgres-billing:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/connectors || exit 1"]
      start_period: 30s
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - onehouse

  debezium-init:
    image: curlimages/curl:latest
    container_name: onehouse-debezium-init
    depends_on:
      debezium:
        condition: service_healthy
    volumes:
      - ./debezium/register_billing.json:/register.json:ro
    entrypoint: >
      /bin/sh -c "
      curl -sf -X POST http://debezium:8083/connectors -H 'Content-Type: application/json' -d @/register.json &&
      echo 'Billing CDC connector registered.'
      "
    networks:
      - onehouse

  spark-cdc:
    build:
      context: ./docker/spark
    container_name: onehouse-spark-cdc
    depends_on:
      spark-master:
        condition: service_started
      spark-worker:
        condition: service_started
      debezium-init:
        condition: service_completed_successfully
    environment:
      SPARK_MODE: submit
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_JOB_SCRIPT: /opt/onehouse/spark/jobs/cdc_billing_stream.py
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-admin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-password}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      ICEBERG_CATALOG: ${ICEBERG_CATALOG:-viettel}
      ICEBERG_WAREHOUSE: s3://${MINIO_WAREHOUSE_BUCKET:-warehouse}/
      ICEBERG_REST_URI: http://iceberg-rest:8181
      S3_ENDPOINT: http://minio:9000
      SPARK_CHECKPOINT_LOCATION: s3a://${MINIO_WAREHOUSE_BUCKET:-warehouse}/checkpoints
    volumes:
      - ./spark/jobs:/opt/onehouse/spark/jobs:ro
    networks:
      - onehouse
    restart: on-failure

  dbt:
    build:
      context: ./docker/dbt
    container_name: onehouse-dbt
    depends_on:
      trino:
        condition: service_started
    environment:
      TRINO_HOST: trino
      TRINO_PORT: 8080
      TRINO_USER: ${TRINO_USER:-admin}
      DBT_PROFILES_DIR: /opt/onehouse/dbt_profiles
    working_dir: /opt/onehouse/dbt_onehouse
    volumes:
      - ./dbt_onehouse:/opt/onehouse/dbt_onehouse
      - ./dbt_profiles:/opt/onehouse/dbt_profiles:ro
    entrypoint: ["dbt"]
    networks:
      - onehouse
    profiles:
      - tools

  airflow-postgres:
    image: postgres:16-alpine
    container_name: onehouse-airflow-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - onehouse

  airflow-init:
    build:
      context: ./docker/airflow
    container_name: onehouse-airflow-init
    depends_on:
      airflow-postgres:
        condition: service_healthy
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW_ADMIN_USERNAME: ${AIRFLOW_ADMIN_USERNAME:-admin}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
      AIRFLOW_ADMIN_EMAIL: ${AIRFLOW_ADMIN_EMAIL:-admin@example.com}
    entrypoint: /bin/bash
    command:
      - -lc
      - >
        airflow db migrate &&
        airflow users create
        --username "$${AIRFLOW_ADMIN_USERNAME}"
        --firstname OneHouse
        --lastname Admin
        --role Admin
        --email "$${AIRFLOW_ADMIN_EMAIL}"
        --password "$${AIRFLOW_ADMIN_PASSWORD}" || true
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
      - ./dbt_onehouse:/opt/airflow/dbt_onehouse
      - ./dbt_profiles:/opt/airflow/dbt_profiles:ro
      - airflow_logs:/opt/airflow/logs
    networks:
      - onehouse
    profiles:
      - orchestration

  airflow-webserver:
    build:
      context: ./docker/airflow
    container_name: onehouse-airflow-webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      TRINO_HOST: trino
      TRINO_PORT: 8080
      TRINO_USER: ${TRINO_USER:-admin}
      DBT_PROFILES_DIR: /opt/airflow/dbt_profiles
    command: ["airflow", "webserver"]
    ports:
      - "8082:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
      - ./dbt_onehouse:/opt/airflow/dbt_onehouse
      - ./dbt_profiles:/opt/airflow/dbt_profiles:ro
      - airflow_logs:/opt/airflow/logs
    networks:
      - onehouse
    profiles:
      - orchestration

  airflow-scheduler:
    build:
      context: ./docker/airflow
    container_name: onehouse-airflow-scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      TRINO_HOST: trino
      TRINO_PORT: 8080
      TRINO_USER: ${TRINO_USER:-admin}
      DBT_PROFILES_DIR: /opt/airflow/dbt_profiles
    command: ["airflow", "scheduler"]
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
      - ./dbt_onehouse:/opt/airflow/dbt_onehouse
      - ./dbt_profiles:/opt/airflow/dbt_profiles:ro
      - airflow_logs:/opt/airflow/logs
    networks:
      - onehouse
    profiles:
      - orchestration

  superset:
    build:
      context: ./docker/superset
    container_name: onehouse-superset
    depends_on:
      trino:
        condition: service_started
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-change-me-in-real-deployments}
      SUPERSET_ADMIN_USERNAME: ${SUPERSET_ADMIN_USERNAME:-admin}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:-admin}
      SUPERSET_ADMIN_EMAIL: ${SUPERSET_ADMIN_EMAIL:-admin@example.com}
      SUPERSET_TRINO_URI: ${SUPERSET_TRINO_URI:-trino://admin@trino:8080/viettel/gold}
    ports:
      - "8088:8088"
    volumes:
      - superset_home:/app/superset_home
      - ./superset:/app/onehouse/superset:ro
    command: ["/bin/bash", "/app/onehouse/superset/bootstrap.sh"]
    networks:
      - onehouse
    profiles:
      - visualization

networks:
  onehouse:
    name: onehouse

volumes:
  minio_data:
  postgres_billing_data:
  airflow_postgres_data:
  airflow_logs:
  superset_home:

